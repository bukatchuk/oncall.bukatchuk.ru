# Тип блока: questions
eyebrow: "// Подойдёт ли вам это"
title_html: "Задайте себе<br>три вопроса"
lead: "Прежде чем смотреть на цену — прикиньте, во что вам обходится её отсутствие."
surface: true
line: true
type: "questions"
items:
  - "Если бы вы за один уикенд получили отработанный алгоритм диагностики — и на следующем дежурстве команда увидела, что вы справляетесь сами, без звонка старшему в три ночи, — стоило бы это 400 000 рублей?"
  - "А если бы вам больше не нужно было ждать настоящей аварии, чтобы проверить себя, выпрашивать тестовый контур и собирать материалы по крупицам, — и вся практика занимала один уикенд?"
  - "А если бы вы могли возвращаться на стенд перед каждым собеседованием и каждой сменой стека, а свою библиотеку runbook'ов приносить в любую новую команду как готовый актив?"
honest:
  label: "Про риск"
  html: "<p><strong>И ещё одно соображение — про риск.</strong> Главный практический совет Талеба — «стратегия штанги»: держать 80–90% активов в безопасном и предсказуемом, а оставшееся вкладывать в ставки с ограниченным риском и большой потенциальной выгодой. Он пережил по этой схеме и «Чёрный понедельник» 1987 года, и кризис 2008-го, причём оба раза с прибылью. Ваша зарплата и текущий грейд — это те самые 80–90%. Один уикенд и один платёж — как раз оставшаяся часть: риск ограничен суммой, а выгода при удачном исходе измеряется грейдом, а не процентами.</p>"
