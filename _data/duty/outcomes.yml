# Тип блока: specs
eyebrow: "// Что остаётся у вас на руках"
title_html: "Воркшоп заканчивается.<br>Артефакты — нет"
lead: "Самый частый исход обучения — «было полезно» без единого файла на выходе. Здесь наоборот: всё, что вы сделали, остаётся у вас и переносится в команду."
line: true
type: "specs"
items:
  - id: "01"
    label: "Решённых инцидентов"
    value: "10"
    unit: "с таймером"
    note: "По каждому зафиксировано время до диагноза — есть с чем сравнивать через квартал."
  - id: "02"
    label: "Написанных постмортемов"
    value: "10"
    unit: "по шаблону"
    note: "Предметный артефакт, а не ощущение: гипотеза, проверка, опровержение, корень."
    variant: "dark"
  - id: "03"
    label: "Личная карта пробелов"
    value: "3—5"
    unit: "тем"
    note: "Не «что учить DevOps», а что держит на месте именно вас."
  - id: "04"
    label: "Библиотека runbook'ов"
    value: "в вики"
    unit: "как есть"
    note: "Можно принести в свою команду и положить без переписывания."
    variant: "safety"
  - id: "05"
    label: "Чек-лист критериев"
    value: "1"
    unit: "страница"
    note: "По чему вас оценивают на дежурстве и на собеседовании."
  - id: "06"
    label: "«Радар технологий»"
    value: "4"
    unit: "выпуска"
    note: "Год доступа: что имеет смысл знать в этом квартале."
    variant: "dark"
