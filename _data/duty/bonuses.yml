# Тип блока: feats
eyebrow: "// Что идёт вместе с воркшопом"
title_html: "Шесть бонусов"
lead: "Пятый достаётся первым десяти в потоке, шестой работает тридцать дней после — уже на вашем настоящем инциденте."
id: "bonus"
type: "feats"
items:
  - id: "Бонус 1"
    title_html: "AI в эксплуатации:<br>второй дежурный, который не устаёт"
    text: "Модель отвечает уверенно всегда — и когда права, и когда нет. Здесь про то, как получать от неё пользу в три часа ночи и не пойти по красиво сформулированной ложной версии."
    bullets:
      - "двенадцать готовых промптов под разбор инцидента"
      - "приёмы проверки: как за минуту понять, что модель придумала"
      - "где она ускоряет вдвое, а где гарантированно врёт"
    result: "вы используете LLM как ускоритель гипотез, а не как источник версий, которые потом приходится опровергать."
    anchor: "Собрать на рынке: 15 000 ₽ — отдельный модуль в профильном курсе"
  - id: "Бонус 2"
    title_html: "Личная библиотека<br>runbook'ов"
    text: "После уикенда у вас остаются не впечатления, а файлы. Десять постмортемов по шаблону и runbook'и к каждому классу аварий — написанные вашими руками и вашим языком."
    bullets:
      - "десять разборов: гипотеза, проверка, опровержение, корень"
      - "runbook на каждый класс — можно положить в вики как есть"
      - "формат, который читается коллегой без вашего присутствия"
    result: "вы приносите в команду готовый актив, а не рассказ о том, как хорошо провели выходные."
    anchor: "Собрать на рынке: 40 000 ₽ — комплект регламентов под заказ"
    variant: "dark"
  - id: "Бонус 3"
    title_html: "«Как вас реально<br>оценивают»"
    text: "Самое неприятное в оценке — что критерии есть, но их никто не проговаривает. Ни на дежурстве, ни на собеседовании. Здесь они выписаны."
    bullets:
      - "что смотрят на дежурстве: не скорость, а порядок действий"
      - "что слушают на собеседовании в рассказе про инцидент"
      - "по каким признакам отличают «починил» от «понял»"
    result: "вы готовитесь к тому, что оценивают, а не к тому, что легче выучить."
    anchor: "Собрать на рынке: 10 000 ₽ — одно mock-интервью"
  - id: "Бонус 4"
    title_html: "«Радар технологий<br>квартала», год доступа"
    text: "Раз в квартал — короткий разбор того, что реально входит в вакансии и в инциденты, а что живёт только в лентах и на конференциях."
    bullets:
      - "по каждой позиции пометка: платят за это или только обсуждают"
      - "что чинит целый класс аварий, а что косметика"
      - "собирается по требованиям вакансий и по задачам заказчиков"
    result: "вы выбираете, чему учиться в этом квартале, за десять минут вместо вечера в лентах."
    anchor: "Собрать на рынке: 12 000 ₽ — технологический обзор у внешнего эксперта"
    variant: "safety"
  - id: "Бонус 5"
    title_html: "Разбор вашего<br>личного стека"
    text: "Стенд — это общая инфраструктура. А инциденты вам будет присылать ваша собственная, со своими странностями. Здесь мы смотрим именно её."
    bullets:
      - "где у вашего стека самые вероятные точки отказа"
      - "какие из десяти сценариев ближе всего к вашей реальности"
      - "что стоит проверить в понедельник, не дожидаясь аварии"
    result: "практика переносится на вашу инфраструктуру, а не остаётся на стенде."
    anchor: "Только первым десяти в потоке — это мои часы"
  - id: "Бонус 6"
    title_html: "Ваш первый настоящий<br>инцидент — разбираем вместе"
    text: "Стенд заканчивается в воскресенье, а дежурства — нет. Самый ценный разбор в вашей жизни случится не на стенде, а на первой боевой аварии после него."
    bullets:
      - "тридцать дней после воркшопа: присылаете свой инцидент"
      - "разбираем вашу запись и вашу последовательность действий"
      - "показываю развилку, где потерялось время, — на вашем случае"
    result: "метод закрепляется на настоящей аварии, пока он ещё свежий."
    anchor: "Собрать на рынке: 24 000 ₽ — два часа ментора-практика"
    variant: "dark"
