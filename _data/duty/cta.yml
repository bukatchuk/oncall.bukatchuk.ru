title: "Один уикенд против года случайных дежурств"
text: "Через два дня у вас на руках десять решённых инцидентов с зафиксированным временем до диагноза, карта из трёх-пяти пробелов, десять постмортемов и библиотека runbook'ов, которую можно принести в свою команду."
button:
  href: "#tar"
  html: "Выбрать тариф <span style=\"color:#FFD2C4;font-weight:700\">[ССЫЛКА ОПЛАТЫ]</span>"
cut:
  label: "Отсечение"
  html: "<p><strong>Кому не подойдёт.</strong> Это апгрейд, а не вход с нуля: нужен рабочий опыт эксплуатации от года. Если вы дежурите давно и уверенно, а не хватает только системы — вам дешевле взять <a href=\"/protocol/\" style=\"color:#fff;text-decoration:underline\">«Протокол дежурного»</a>.</p>"
