# Тип блока: cards3
line: true
eyebrow: "// Гарантия"
title_html: "Две гарантии,<br>а не одна общая фраза"
lead: "Первая закрывает риск «мне не подойдёт формат», вторая — риск «я не получу результат»."
id: "guar"
type: "cards3"
cards:
  - title: "Слой 1. Первый инцидент"
    text: "Прошли первый инцидент на стенде и поняли, что это не ваше, — возвращаю деньги полностью. Без объяснений и без обсуждения."
    highlight: true
  - title: "Слой 2. Результат уикенда"
    text: "Если после воркшопа у вас на руках нет десяти постмортемов, карты пробелов и библиотеки runbook'ов — возвращаю деньги. Проверяется не ощущением, а тем, что лежит в ваших файлах."
    highlight: false
  - title: "Что нужно от вас"
    text: "Прийти на оба дня и пройти инциденты. Гарантия не требует доказывать старание — она требует только присутствия."
    highlight: false
