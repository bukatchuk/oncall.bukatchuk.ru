# Тип блока: beats
eyebrow: "// Вопрос — ответ"
title_html: "Шесть возражений,<br>которые вы уже себе задавали"
lead: "Ни одно из них не придумано мной: это то, что пишут и говорят инженеры, когда речь заходит о тренировке на инцидентах."
line: true
type: "beats"
items:
  - q: "Вы прошли курсы, посмотрели доклады — а когда прилетел настоящий Sev1, в голове оказалось пусто?"
    a: "Больше и не надо. На стенде это будет уже одиннадцатый раз."
  - q: "Где тренироваться, если ронять настоящий прод нельзя?"
    a: "Стенд-двойник ломается по кнопке и восстанавливается по кнопке — и за это, что характерно, никого не увольняют."
  - q: "Вариантов развития десятки: с чего начать, что учить первым?"
    a: "И не надо знать. Диагностика за тридцать минут выдаёт список из трёх тем — ваших, а не «для всех»."
  - q: "Приходится самому собирать материалы по крупицам, а потом самому же придумывать себе задачи для тренировки?"
    a: "Можете забыть об этом. Инциденты ставятся как боевые тикеты, с алертами и эскалацией."
  - q: "Не понимаете, по каким критериям вас вообще оценивают — на дежурстве, на собеседовании?"
    a: "Чек-лист выдаётся до старта, а не после провала. Согласитесь, это несколько разные вещи."
  - q: "Сколько обычно уходит, чтобы перестать бояться дежурства? Год? Три? Пять случайных аварий, из которых удалось выбраться?"
    a: "Теперь сорок восемь часов."
honest:
  label: "Что это меняет"
  html: "<p><strong>«Дежурство без паники» делает всё сам.</strong> Ломает инфраструктуру сам. Ставит задачу как боевой тикет сам. Считает время до диагноза сам. Уже не нужен ментор за 15 000 ₽ в час, чтобы разобрать один инцидент: стенд выдаёт десять — и каждый доводится до причины, а не до «перезагрузка помогла». Перезагрузка, признаем, иногда действительно помогает — просто это не диагноз, а отсрочка.</p>"
