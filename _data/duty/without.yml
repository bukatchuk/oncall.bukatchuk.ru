# Тип блока: specs
eyebrow: "// Без чего это происходит"
title_html: "Шесть вещей,<br>которых здесь не будет"
lead: "И три, которые нужны от вас: рабочий опыт эксплуатации от года, браузер с доступом к стенду и два свободных дня подряд."
surface: true
type: "specs"
items:
  - id: "01"
    label: "Риска для настоящего прода"
    note: "Стенд-двойник ломается по кнопке и восстанавливается по кнопке. За это никого не увольняют."
  - id: "02"
    label: "Месяцев теории до практики"
    note: "Первый инцидент запускается в первые часы, а не после вводного модуля про то, что такое SLA."
    variant: "dark"
  - id: "03"
    label: "Выпрашивания контура"
    note: "А где вы видели компанию, которая выдаёт тестовый контур по первой просьбе?"
  - id: "04"
    label: "Публичной оценки"
    note: "Разбор идёт один на один. Никто не увидит, чего вы не знали на третьем инциденте."
    variant: "safety"
  - id: "05"
    label: "Чужого графика"
    note: "Без домашних заданий к дате и вебинаров, на которые не попасть после смены."
  - id: "06"
    label: "Перебора курсов"
    note: "Входная диагностика за тридцать минут выдаёт список из трёх тем — ваших, а не «для всех»."
    variant: "dark"
