# Тип блока: cards3
eyebrow: "// Честный ответ конкуренту"
title_html: "«Чем это отличается<br>от того, что уже есть?»"
lead: "Правильный вопрос, и я отвечу прямо, без «у нас уникальная авторская методика»."
id: "diff"
type: "cards3"
cards:
  - title: "Что есть на рынке"
    text: "«Задачник DevOps» Слёрма: десять инцидентов на стендах с автопроверкой, от 7 900 ₽. Траблшутинг-соревнования Rebrain: вход стоит рубль. Если нужно просто потренироваться гасить аварии — идите туда, это хорошие продукты и они в разы дешевле."
    highlight: false
  - title: "Разница ровно одна"
    text: "Там проверяют результат. Здесь проверяют метод. Автопроверка смотрит, поднялся сервис или нет: она не отличает того, кто дошёл до причины, от того, кто наугад перезапустил три компонента и попал."
    highlight: true
  - title: "Что из этого следует"
    text: "Задачник научит гасить десять конкретных аварий. Здесь вы получаете метод, который переносится на одиннадцатую — ту, которой на стенде не было и которую пришлёт ваш собственный продакшен. Если этой разницы вам не нужно — берите Задачник, серьёзно. Он дешевле и своё дело делает."
    highlight: false
terminal:
  title: "чего нет в автопроверке"
  paragraphs:
    - "<span class=\"c\">$</span> <span class=\"g\">diff</span> --autocheck vs method"
    - "Автопроверка на стенде смотрит одно: поднялся сервис или не поднялся. Она не отличает инженера, который дошёл до причины, от инженера, который наугад перезапустил три компонента и попал. <b>Обе попытки засчитываются одинаково.</b> А на дежурстве в три ночи и на собеседовании через месяц разница между ними — решающая."
    - "<span class=\"c\"># поэтому здесь после каждой аварии есть то, чего автопроверка не даёт:</span>"
    - "<span class=\"a\">+</span> письменный постмортем по шаблону: гипотеза, проверка, чем опровергли, корень, что чинит класс проблем целиком<br> <span class=\"a\">+</span> две персональные сессии по записи вашего прохождения — не «правильный ответ», а развилки, где вы потеряли пятнадцать минут на ложной версии<br> <span class=\"a\">+</span> тридцать дней сопровождения на вашем настоящем инциденте после практики: стенд заканчивается, а дежурства нет"
