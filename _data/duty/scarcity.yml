  - title: "Ближайший заход"
    text: "<span style=\"color:#fff;font-weight:700\">[ДАТЫ ЗАХОДА]</span> · мест: <span style=\"color:#fff;font-weight:700\">[ЧИСЛО]</span>. Формат — два дня подряд."
    highlight: true
  - title: "Первым десяти"
    text: "Разбор личного стека достаётся первым десяти участникам потока. Это тоже не лотерея ради лотереи: разбор — это мои часы."
    highlight: false
