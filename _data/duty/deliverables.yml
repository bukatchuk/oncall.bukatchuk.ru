# Тип блока: bento
surface: true
line: true
eyebrow: "// Что конкретно вы получите"
title_html: "Шесть компонентов"
lead: "Каждый существует не для полноты набора, а под конкретную причину, по которой рефлекс диагностики не появляется сам."
id: "what"
type: "bento"
cards:
  - n: "Компонент 1"
    title_html: "Инцидент-симулятор<br>«10 дежурств за уикенд»"
    text: "Десять сценариев из личной практики на проектах-миллионниках: падение Nginx под пиком, split-brain кворума etcd, деградация базы на распродаже, утечка file descriptors, каскадный отказ через таймауты. Каждый — под таймером, с настоящими алертами и эскалацией."
    variant: "dark"
    wide: true
    bars:
      - h: "100%"
        hi: true
      - h: "70%"
        hi: true
      - h: "85%"
        hi: true
      - h: "55%"
        hi: true
      - h: "95%"
        hi: true
      - h: "65%"
        hi: true
      - h: "40%"
        hi: false
      - h: "30%"
        hi: false
  - n: "Компонент 2"
    title_html: "Изолированный<br>стенд-двойник"
    text: "Копия нагруженной инфраструктуры с генератором боевого трафика. Один инцидент можно перепройти пять раз подряд, меняя гипотезу."
    tags:
      - text: "По кнопке"
        style: "filled"
      - text: "Без риска"
        style: ""
  - n: "Компонент 3"
    title_html: "Входная диагностика<br>и карта развития"
    text: "Один маршрут из трёх-пяти тем вместо перебора программ месяцами. Плюс зафиксированный факт: что вы уже тянете на уровне Senior."
    variant: "safety"
    stat: "30&nbsp;<small>минут</small>"
  - n: "Компонент 4"
    title_html: "Точечные модули<br>под ваши пробелы"
    text: "По два-четыре часа, каждый с измеримым артефактом: рабочий конфиг, дашборд, runbook. Назначаются по итогам диагностики, а не по каталогу."
    tags:
      - text: "Конфиг"
        style: ""
      - text: "Дашборд"
        style: ""
      - text: "Runbook"
        style: "safety"
  - n: "Компонент 5"
    title_html: "Постмортем-протокол<br>«От симптома к причине»"
    text: "После каждого инцидента — блок «что стояло за симптомом» и письменный постмортем: гипотеза, проверка, опровержение, корень, что чинит класс проблем целиком."
    tags:
      - text: "Шаблон"
        style: "filled"
      - text: "10 постмортемов"
        style: ""
  - n: "Компонент 6"
    title_html: "1:1 разбор вашего решения"
    text: "Две персональные сессии по записи вашего прохождения, а не по общему эталону. Не «правильный ответ», а развилки: где вы потеряли пятнадцать минут на ложной гипотезе и по какому признаку её можно было отбросить сразу."
    wide: true
    tags:
      - text: "Один на один"
        style: "safety"
      - text: "По вашей записи"
        style: ""
