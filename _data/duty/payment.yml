eyebrow: "// Как заплатить"
title_html: "Три способа,<br>включая самый удобный"
lead: "Самый частый вопрос на этом месте — не «сколько», а «как это провести»."
surface: true
line: true
type: "cards3"
cards:
  - title: "За счёт работодателя"
    text: "Счёт на компанию, договор, акт, обмен через ЭДО с квалифицированной электронной подписью. Плюс готовое письмо-обоснование для руководителя: что компания получает, за сколько и как это окупается — чтобы разговор был служебной задачей, а не личной просьбой."
    highlight: true
  - title: "Своими средствами"
    text: "Полная оплата картой или по счёту от ИП. Возможна оплата частями — <span class=\"ph\">[УСЛОВИЯ РАССРОЧКИ]</span>. Все документы приходят на почту сразу после оплаты."
    highlight: false
  - title: "Если нужен только метод"
    text: "Стенд стоит денег, потому что это работающая инфраструктура. Если практика вам не нужна, есть отдельный пакет материалов — <a href=\"/protocol/\" style=\"color:var(--safety);text-decoration:underline\">«Протокол дежурного» за 19 900 ₽</a>, и его стоимость засчитывается сюда в течение тридцати дней."
    highlight: false
