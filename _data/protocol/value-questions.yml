  html: "<p><strong>И честная арифметика.</strong> Один разбор инцидента с внешним SRE-консультантом стоит около 20 000 ₽ — это дороже, чем весь пакет. Разница не в качестве разбора, а в том, что здесь нет ни одного часа моего времени: копия материалов стоит мне ноль, поэтому и цена другая.</p>"
