  - title: "Чего он не даёт"
    text: "Рефлекса под давлением. В четыре утра работает то, что делали руками достаточно раз. Протокол сокращает путь, но не заменяет повторения."
    highlight: false
  - title: "Что с этим делать"
    text: "Если после первых разборов станет ясно, что нужна практика, — <a href=\"/\" style=\"color:#fff;text-decoration:underline\">«Дежурство без паники»</a>: десять аварий под таймером на копии боевой инфраструктуры. Ваши 19 900 ₽ засчитываются туда полностью в течение тридцати дней, доплачиваете разницу."
    highlight: true
