eyebrow: "// Гарантия"
title_html: "Найдите развилку"
lead: "Проверка занимает один вечер и делается на вашем последнем инциденте."
id: "guar"
type: "cards3"
cards:
  - title: "Условие простое"
    text: "Откройте протокол и разберите по нему свой последний инцидент. Если ни одной развилки, которую вы прошли не так, не нашлось — возвращаю деньги."
    highlight: true
  - title: "Почему так можно обещать"
    text: "Потому что развилок шестнадцать, а инцидент, разобранный «по памяти», почти всегда содержит хотя бы одну проверку, сделанную не в том порядке."
    highlight: false
  - title: "Что не нужно доказывать"
    text: "Ни скриншотов, ни объяснений. Написали — вернул."
    highlight: false
