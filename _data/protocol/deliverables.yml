    title_html: "Постмортем-протокол<br>«От симптома к причине»"
    text: "Не «шаблон постмортема», а правила: каким измерением версия опровергается. Каталог из шестнадцати развилок и таблица цены измерений — сколько минут стоит каждая проверка и сколько вариантов она отсекает."
