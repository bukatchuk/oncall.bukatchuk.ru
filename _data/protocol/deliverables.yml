  - n: "Позиция 2"
    title_html: "Пять разобранных<br>аварий"
    text: "Пять разных классов отказа с проектов-миллионников, ни одна не опубликована. От симптома до причины, включая ложные версии, на которые ушло время."
    tags:
      - text: "Каскад"
        style: ""
      - text: "База под пиком"
        style: ""
      - text: "Кворум"
        style: "safety"
  - n: "Позиция 3"
    title_html: "AI в эксплуатации"
    text: "ИИ как ускоритель гипотез: библиотека промптов для разбора инцидента и приёмы проверки того, что модель выдала."
    variant: "safety"
    stat: "12&nbsp;<small>промптов</small>"
  - n: "Позиция 4"
    title_html: "«Как вас реально<br>оценивают»"
    text: "Чек-лист критериев, по которым вас смотрят на дежурстве и на собеседовании. До проверки, а не после."
    tags:
      - text: "Дежурство"
        style: ""
      - text: "Собеседование"
        style: "filled"
  - n: "Позиция 5"
    title_html: "«Радар технологий»<br>на год"
    text: "Что имеет смысл учить в этом квартале, а что рыночный шум. По каждой позиции пометка: платят за это или только обсуждают."
    tags:
      - text: "4 выпуска"
        style: "filled"
  - n: "Бонус"
    title_html: "Постмортем, на котором ищут причину, а не виноватого"
    text: "Сценарий командного разбора на сорок минут: порядок вопросов, формулировки, снимающие защитную реакцию, список фраз, после которых разбор превращается в разнос, и правило «обсуждаем систему, а не человека»."
    wide: true
    tags:
      - text: "40 минут"
        style: "safety"
      - text: "Готовый сценарий"
        style: ""
      - text: "Без согласований сверху"
