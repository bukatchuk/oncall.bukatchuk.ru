# Тип блока: ps
type: "ps"
line: true
rows:
  - label: "P.S."
    text: "Самая дорогая часть дежурства — не починка. Это те минуты, когда вы смотрите на экран и выбираете, что проверить первым. У опытного инженера этот выбор выглядит как интуиция, но интуиция здесь — просто свёрнутый порядок. Его можно развернуть обратно и записать, что я и сделал."
  - label: "P.P.S."
    text: "Проверить пакет можно в тот же вечер: возьмите свой последний инцидент и разберите его по протоколу. Если ни одной развилки, пройденной не так, не нашлось — напишите, верну деньги. Материалы останутся у вас."
  - label: "P.P.P.S."
    text: "И ещё раз, потому что это важнее продажи: если вы замираете перед экраном с алертами — вам нужен не этот пакет, а стенд и практика под таймером. Файлы не заменяют руки."
