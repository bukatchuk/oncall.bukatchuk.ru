# Тип блока: feats
eyebrow: "// Подробно"
title_html: "Что внутри<br>каждой позиции"
lead: "Коротко про состав было выше. Здесь — что именно вы открываете и что с этим делаете на ближайшем дежурстве."
line: true
type: "feats"
items:
  - id: "Позиция 1"
    title_html: "Постмортем-протокол<br>«От симптома к причине»"
    text: "Шаблонов постмортема в интернете десятки, и все они про форму отчёта. Здесь про другое: каким измерением версия опровергается и в каком порядке эти измерения делать."
    bullets:
      - "каталог из шестнадцати развилок: симптом → что проверить → что это отсекает"
      - "таблица цены измерений: сколько минут стоит каждая проверка"
      - "правило остановки: когда версия считается опровергнутой, а не «маловероятной»"
      - "форма протокола, которую заполняют по ходу, а не после"
    result: "вы проверяете версии в порядке, где каждая следующая проверка отсекает половину оставшихся, а не в порядке, в каком они пришли в голову."
    anchor: "Собрать на рынке: 20 000 ₽ — один разбор с внешним SRE-консультантом"
  - id: "Позиция 2"
    title_html: "Библиотека из пяти<br>разобранных аварий"
    text: "Пять разных классов отказа, а не один и тот же пять раз. Каждая — с проектов, где простой считается в деньгах сразу, и ни одна не опубликована."
    bullets:
      - "каскадный отказ через таймауты внешней зависимости"
      - "деградация базы на пике: конкуренция за горячие записи"
      - "исчерпание невидимого ресурса"
      - "потеря кворума при плановых работах"
      - "потеря связности при зелёных метриках компонентов"
    result: "вы видите не «как чинили», а где терялось время — включая версии, которые звучали убедительно и оказались ложными."
    anchor: "Собрать на рынке: 20 000 ₽ — у консультанта это один разбор, здесь их пять"
    variant: "dark"
  - id: "Позиция 3"
    title_html: "«AI в эксплуатации»:<br>ИИ как ускоритель гипотез"
    text: "Модель отвечает уверенно всегда — и когда права, и когда нет. Вопрос не в том, спрашивать ли её в три ночи, а в том, как за минуту понять, что она придумала."
    bullets:
      - "двенадцать промптов под разбор инцидента"
      - "приёмы проверки ответа: что спросить следом, чтобы поймать выдумку"
      - "где она ускоряет вдвое, а где гарантированно врёт"
      - "как использовать её для формулировки постмортема, а не для диагноза"
    result: "LLM экономит минуты на гипотезах и не подсовывает версий, которые потом приходится опровергать час."
    anchor: "Собрать на рынке: 15 000 ₽ — отдельный модуль в профильном курсе"
  - id: "Позиция 4"
    title_html: "Чек-лист «Как вас<br>реально оценивают»"
    text: "Критерии есть всегда — их просто не проговаривают. Ни на дежурстве, ни на собеседовании."
    bullets:
      - "что смотрят на дежурстве: не скорость, а порядок"
      - "что слушают в рассказе про сложный инцидент"
      - "по каким признакам отличают «починил» от «понял»"
      - "как это звучит в ответе, который засчитывают на Senior"
    result: "вы готовитесь к тому, что оценивают, а не к тому, что легче выучить."
    anchor: "Собрать на рынке: 10 000 ₽ — одно mock-интервью"
    variant: "safety"
  - id: "Позиция 5"
    title_html: "«Радар технологий<br>квартала», год доступа"
    text: "Раз в квартал — короткий разбор того, что действительно входит в вакансии и в инциденты, а что живёт только в лентах."
    bullets:
      - "по каждой позиции пометка: платят за это или только обсуждают"
      - "что чинит целый класс аварий, а что косметика"
      - "собирается по требованиям вакансий и по задачам заказчиков"
    result: "выбор, чему учиться в этом квартале, занимает десять минут вместо вечера в лентах."
    anchor: "Собрать на рынке: 12 000 ₽ — технологический обзор у внешнего эксперта"
  - id: "Бонус"
    title_html: "Постмортем, на котором ищут<br>причину, а не виноватого"
    text: "Единственная позиция пакета, которая смотрит за пределы вашей собственной работы — на команду."
    bullets:
      - "порядок вопросов на сорок минут разбора"
      - "формулировки, снимающие защитную реакцию"
      - "список фраз, после которых разбор превращается в разнос"
      - "правило «обсуждаем систему, а не человека» — и что делать, когда его нарушает руководитель"
      - "как встроить это в существующий процесс, не спрашивая разрешения сверху"
    result: "команда разбирает аварии сама, по протоколу, и приносит вам причины, а не оправдания."
    anchor: "Собрать на рынке: 20 000 ₽ — фасилитация командного разбора"
    variant: "dark"
