# Тип блока: specs
eyebrow: "// Точка А"
title_html: "Гасить одну и ту же аварию<br>по третьему разу больше не нужно"
lead: "Разобрались с инцидентом, закрыли тикет, а через месяц он вернулся в чуть другом виде — значит, чинили симптом."
line: true
type: "specs"
items:
  - id: "01"
    label: "Постмортем по чужому шаблону"
    note: "Где графа «root cause» заполняется одним предложением и никого ни к чему не обязывает."
  - id: "02"
    label: "Полтора часа ночью"
    note: "На проверку версии, которую можно было отбросить одним измерением за минуту. Именно эти развилки и составляют половину пакета."
    variant: "dark"
  - id: "03"
    label: "Уверенный ответ LLM"
    note: "Который непонятно как проверять. В пакете — приёмы проверки того, что она выдала."
  - id: "04"
    label: "Разбор, где ищут виноватого"
    note: "После такого разбора люди перестают приносить проблемы, и вы узнаёте о них последним."
    variant: "safety"
  - id: "05"
    label: "Версии в порядке их прихода в голову"
    note: "Вместо порядка, где каждая следующая проверка отсекает половину оставшихся вариантов."
  - id: "06"
    label: "Ленты раз в квартал"
    note: "Попытка понять, что из нового реально войдёт в вакансии, а что шум."
    variant: "dark"
honest:
  label: "Честная часть сделки"
  html: "<p><strong>«Протокол дежурного» не делает ничего сам — и это честная часть сделки.</strong> Он даёт порядок, по которому работаете вы. Полигон у вас и так есть: он называется рабочим дежурством.</p>"
