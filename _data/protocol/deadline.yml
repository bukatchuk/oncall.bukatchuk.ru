    text: "«Радар технологий» — квартальный: версия прошлого квартала уже не отвечает на вопрос «что учить сейчас»."
    highlight: false
  - title: "Единственный настоящий срок"
    text: "Зачёт 19 900 ₽ в «Дежурство без паники» действует 30 дней с момента покупки."
    highlight: true
  - title: "И проверка на себе"
    text: "Разберите по протоколу свой последний инцидент в тот же вечер. Если развилок не нашлось — верну деньги, а вы останетесь с материалами."
    highlight: false
