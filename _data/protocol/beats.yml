# Тип блока: beats
eyebrow: "// Вопрос — ответ"
title_html: "Пять реплик,<br>которые вы себе уже говорили"
lead: "Это не гипотезы о боли: так формулируют сами инженеры, когда речь заходит о разборе инцидентов."
line: true
type: "beats"
items:
  - q: "Вы разобрались с инцидентом, закрыли тикет, а через месяц он вернулся в чуть другом виде?"
    a: "Значит, чинили симптом. Протокол существует ровно для того, чтобы этого не было."
  - q: "Пишете постмортем по шаблону из чужого блога, где графа «root cause» заполняется одним предложением?"
    a: "Больше не нужно. Здесь развилка описана измерением, которым версия опровергается, а не словом."
  - q: "Полтора часа ночью ушли на проверку версии, которую можно было отбросить одним измерением за минуту?"
    a: "Знакомая история. Именно эти развилки и составляют половину пакета."
  - q: "Спрашиваете у LLM про инцидент, получаете уверенный ответ и не знаете, как его проверить?"
    a: "И не надо гадать: в модуле про AI — приёмы проверки того, что она выдала."
  - q: "На разборе в команде обсуждают, кто именно выкатил, а не что именно сломалось?"
    a: "После такого разбора люди перестают приносить проблемы, и вы узнаёте о них последним. Сценарий в бонусе меняет это."
