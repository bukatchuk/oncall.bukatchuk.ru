terminal:
  title: "incident — все компоненты зелёные, а продакшн лежит"
  paragraphs:
    - "<span class=\"c\">$</span> <span class=\"g\">postmortem</span> --case=firewall"
    - "<b>Симптом.</b> Приложение не отвечает. Метрики базы полностью зелёные, все компоненты в норме, мониторинг молчит."
    - "<b>Что оказалось.</b> Потеряна сетевая связность между новым облаком и основным дата-центром: собственные правила файрвола, применённые пайплайном. Кеш какое-то время маскировал отказ и удлинил диагностику."
    - "<span class=\"a\">Диагностика заняла втрое больше времени, чем устранение.</span> Ответ лежал в истории изменений инфраструктуры, куда за первые пятнадцать минут не посмотрел никто."
    - "<span class=\"c\"># вывод, который переносится:</span> мониторинг в этом классе аварий бесполезен по своей природе — он показывает компоненты, а сломалось между ними."
    - "<span class=\"c\">$</span> <span class=\"g\">open</span> <a href=\"https://habr.com/ru/articles/1078876/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--term-green);text-decoration:underline\">habr.com/ru/articles/1078876</a> <span class=\"c\"># ~10 000 читателей</span>"
