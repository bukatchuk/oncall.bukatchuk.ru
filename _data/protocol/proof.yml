items:
  - title: "Собрал Олег Букатчук"
    html: "DevOps/SRE-инженер, 19 лет в эксплуатации. cian.ru, aliexpress.ru, mos.ru — три разных профиля нагрузки, то есть три разных класса отказов, а не один и тот же десять раз."
  - title: "Аварии из личной практики"
    html: "Ни один разбор в пакете не опубликован. Это не пересказ чужих постмортемов с Хабра."
  - title: "Проверить, не спрашивая разрешения"
    html: "<a href=\"https://github.com/olegbukatchuk\" target=\"_blank\" rel=\"noopener\">github.com/olegbukatchuk</a> и интервью <a href=\"https://youtu.be/UruvjXoRFZw?si=ADRNDOQc5jFClvuv&t=556\" target=\"_blank\" rel=\"noopener\">«Как хорошо больше не писать код»</a> на «Мы обречены»."
