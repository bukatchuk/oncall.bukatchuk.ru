title: "Если вы хоть раз замирали перед экраном с алертами — берите стенд, а не файлы"
paragraphs:
  - "Метод в файлах не заменяет практику. В четыре утра работает не то, что вы прочитали, а то, что вы делали руками достаточно раз, чтобы рука не дрожала. Вам нужен стенд, десять аварий под таймером и живой разбор — это другой мой продукт, <a href=\"/\" style=\"color:#fff;text-decoration:underline\">«Дежурство без паники»</a>, и стоит он дороже по понятной причине."
  - "<strong>Здесь только материалы. Ни стенда, ни сессий, ни меня.</strong> Этот пакет для тех, у кого руки уже есть, а не хватает системы: вы гасите аварии уверенно, но каждый раз заново, и через месяц то же самое повторяется, потому что чинили симптом."
  - "Я предпочитаю сказать это на первом экране, а не собрать деньги и получить возврат через неделю. Продавать файлы человеку, которому нужен полигон, — способ один раз заработать и навсегда потерять."
eyebrow: "// Сразу о том, кому это не нужно"
