---
layout: default
---
<section class="page">
  <div class="page__in">
    <a class="page__back" href="{{ '/' | relative_url }}">← На главную</a>
    <h1>{{ page.title }}</h1>
    <div class="page__meta">{% if page.revision %}Редакция от {{ page.revision }}{% endif %}{% if page.subtitle %} · {{ page.subtitle }}{% endif %}</div>
    {{ content }}
  </div>
</section>
